name: Library pages
# Prepares newly added Library books (pages, printed text, covers). Started by the site when a book is added, and once a day as a safety net.
# Nothing about the books is printed here: the full log is sent privately to the site.
on:
  repository_dispatch:
    types: [book-pages]
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency: book-pages
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      API: ${{ secrets.SITE }}
      MAP_OPS_KEY: ${{ secrets.JOBS_KEY }}
    steps:
      - name: Anything waiting?
        id: n
        run: |
          [ -n "$API" ] && [ -n "$MAP_OPS_KEY" ] || { echo "not set up yet"; echo "n=0" >> "$GITHUB_OUTPUT"; exit 0; }
          code=$(curl -s -o /tmp/p.json -w '%{http_code}' -H "x-ops-key: $MAP_OPS_KEY" "$API/api/ops/books/pending" || echo 000); echo "site answered $code"
          a=$(jq '.books | length' /tmp/p.json 2>/dev/null || echo 0)
          c=$(curl -s -H "x-ops-key: $MAP_OPS_KEY" "$API/api/ops/books/nocover" | jq '.books | length' 2>/dev/null || echo 0)
          echo "waiting: $a, covers to choose: $c"; echo "n=$((a + c))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.n.outputs.n != '0'
        with: { sparse-checkout: 'ops', fetch-depth: 1 }
      - uses: actions/setup-node@v4
        if: steps.n.outputs.n != '0'
        with: { node-version: 22 }
      - name: Tools
        if: steps.n.outputs.n != '0'
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq poppler-utils unzip tesseract-ocr tesseract-ocr-lat tesseract-ocr-grc tesseract-ocr-ell tesseract-ocr-ara tesseract-ocr-fas tesseract-ocr-heb tesseract-ocr-tur tesseract-ocr-fra tesseract-ocr-spa tesseract-ocr-cat tesseract-ocr-ita tesseract-ocr-por tesseract-ocr-deu tesseract-ocr-eng >/dev/null
          pip install --quiet pymupdf >/dev/null
          cd ops/books && npm i --no-save sharp@0.34.5 >/dev/null 2>&1
      - name: Read the pages
        if: steps.n.outputs.n != '0'
        run: node ops/books/read.mjs > /tmp/job.log 2>&1; echo "finished (exit $?), $(wc -l < /tmp/job.log) log lines sent privately to the site"
      - name: Send the log privately
        if: always() && steps.n.outputs.n != '0'
        run: '[ -f /tmp/job.log ] && curl -s -o /dev/null -w "log %{http_code}\n" -X POST -H "x-ops-key: $MAP_OPS_KEY" --data-binary @/tmp/job.log "$API/api/ops/joblog?job=books" || true'
      - name: Carry on with the rest of a long book
        if: steps.n.outputs.n != '0'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: if [ -f /tmp/book-more ]; then gh workflow run books.yml --ref main -R "$GITHUB_REPOSITORY" && echo "next part started"; else echo "nothing left"; fi
